<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0A0A0F}
body{color:#F0F0F8;font-family:'DM Sans',sans-serif;overflow:hidden}
#root{height:100%}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2A2A3A;border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:#00D084}
input,select,textarea,button{font-family:'DM Sans',sans-serif}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideInRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes slideInLeft{from{transform:translateX(-100%)}to{transform:translateX(0)}}
@keyframes checkPop{0%{transform:scale(0.8)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
.page-enter{animation:fadeIn .25s ease-out}
.modal-slide{animation:slideInRight .28s cubic-bezier(0.16,1,0.3,1)}
.check-pop{animation:checkPop .3s ease-out}
</style>

<div id="root"></div>
<div id="errdisplay" style="display:none;position:fixed;inset:0;background:#0A0A0F;color:#FF4757;font-family:monospace;font-size:13px;padding:32px;z-index:9999;white-space:pre-wrap;overflow:auto"></div>
<script>
window.addEventListener('error', function(e){
  var d = document.getElementById('errdisplay');
  d.style.display = 'block';
  d.textContent += '❌ ' + e.message + '\n   em: ' + e.filename + ':' + e.lineno + '\n\n';
});
window.addEventListener('unhandledrejection', function(e){
  var d = document.getElementById('errdisplay');
  d.style.display = 'block';
  d.textContent += '❌ Promise: ' + e.reason + '\n\n';
});
// Verifica se dependências carregaram
window.addEventListener('load', function(){
  var missing = [];
  if(!window.React) missing.push('React');
  if(!window.ReactDOM) missing.push('ReactDOM');
  if(!window.Recharts) missing.push('Recharts');
  if(!window.LucideReact) missing.push('LucideReact');
  if(missing.length){
    var d = document.getElementById('errdisplay');
    d.style.display = 'block';
    d.textContent += '⚠️ Scripts não carregaram: ' + missing.join(', ') + '\n\nVerifique sua conexão com a internet.\n';
  }
});
</script>
